<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เตชินท์ — หน้าแนะนำตัว</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --mint: #A9E8D4;
            --mint-dark: #6BC7A8;
            --mint-soft: #E3F7EF;
            --brown: #6B4A38;
            --brown-dark: #4A3226;
            --ink: #4A3226;
            --ink-soft: #8C6F5E;
            --line: #D9C9BB;
            --paper: #FFFDF9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Mali', cursive;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 48px 20px;
            position: relative;
            overflow: hidden;

            /* polka dot background, matching the mint + brown reference */
            background-color: var(--mint);
            background-image:
                radial-gradient(circle, var(--brown) 9px, transparent 10px),
                radial-gradient(circle, var(--brown) 9px, transparent 10px);
            background-size: 84px 84px, 84px 84px;
            background-position: 0 0, 42px 42px;
        }

        .sparkle {
            position: absolute;
            font-size: 20px;
            animation: twinkle 2.4s ease-in-out infinite;
            z-index: 2;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.15) rotate(15deg); }
        }

        .card {
            max-width: 880px;
            width: 100%;
            background: var(--paper);
            border: 2px solid var(--line);
            border-radius: 32px;
            display: grid;
            grid-template-columns: 1fr 300px;
            overflow: hidden;
            position: relative;
            z-index: 1;
            box-shadow: 0 20px 50px -20px rgba(74, 50, 38, 0.35), 0 0 0 6px var(--mint-soft);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 28px 60px -20px rgba(74, 50, 38, 0.4), 0 0 0 6px var(--mint-soft);
        }

        /* ---- content ---- */
        .content {
            padding: 60px 52px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Baloo 2', cursive;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--mint-dark);
            background: var(--mint-soft);
            padding: 6px 14px;
            border-radius: 20px;
            width: fit-content;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Baloo 2', cursive;
            font-size: 42px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 8px;
            color: var(--brown-dark);
        }

        .subtitle {
            font-size: 17px;
            font-weight: 500;
            color: var(--ink-soft);
            margin-bottom: 30px;
        }

        /* signature element: cute wavy line */
        .pulse {
            width: 100%;
            max-width: 260px;
            height: 36px;
            margin-bottom: 32px;
        }
        .pulse path {
            fill: none;
            stroke: var(--mint-dark);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: draw 2.2s ease-out forwards;
        }
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .pulse path { animation: none; stroke-dashoffset: 0; }
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 8px;
        }

        .info-item {
            display: grid;
            grid-template-columns: 90px 1fr;
            align-items: center;
            padding: 12px 16px;
            background: var(--mint-soft);
            border-radius: 16px;
            border: 1px solid var(--line);
            transition: transform 0.25s ease;
        }
        .info-item:hover { transform: translateX(4px); }

        .info-label {
            font-family: 'Baloo 2', cursive;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: var(--mint-dark);
        }

        .info-value {
            font-size: 15px;
            font-weight: 500;
            color: var(--brown-dark);
        }

        .github-note {
            margin-top: 24px;
            font-size: 13px;
            color: var(--ink-soft);
            display: flex;
            gap: 8px;
            align-items: baseline;
        }
        .github-note strong { color: var(--mint-dark); font-weight: 700; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            padding: 14px 26px;
            background: var(--mint);
            color: var(--brown-dark);
            text-decoration: none;
            font-family: 'Baloo 2', cursive;
            font-size: 15px;
            font-weight: 600;
            width: fit-content;
            border-radius: 30px;
            box-shadow: 0 6px 0 var(--mint-dark);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn:hover {
            transform: translateY(2px);
            box-shadow: 0 4px 0 var(--mint-dark);
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--mint-dark);
        }
        .btn svg { width: 16px; height: 16px; }

        /* ---- image ---- */
        .image-section {
            position: relative;
            background-color: var(--mint-soft);
            background-image:
                radial-gradient(circle, var(--brown) 5px, transparent 6px),
                radial-gradient(circle, var(--brown) 5px, transparent 6px);
            background-size: 44px 44px, 44px 44px;
            background-position: 0 0, 22px 22px;
            opacity: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .image-section::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 253, 249, 0.55);
        }

        .profile-img-wrapper {
            position: relative;
            width: 210px;
            height: 210px;
            animation: bob 3.5s ease-in-out infinite;
            z-index: 1;
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--paper);
            box-shadow: 0 10px 25px -8px rgba(74, 50, 38, 0.45);
        }

        .ring {
            position: absolute;
            inset: -12px;
            border: 3px dashed var(--brown);
            border-radius: 50%;
            opacity: 0.55;
            animation: spin 18s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .badge {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--paper);
            border: 2px solid var(--mint-dark);
            padding: 8px 18px;
            border-radius: 30px;
            font-family: 'Baloo 2', cursive;
            font-size: 12px;
            font-weight: 600;
            color: var(--brown-dark);
            white-space: nowrap;
            box-shadow: 0 4px 10px -4px rgba(74, 50, 38, 0.35);
        }

        @media (max-width: 720px) {
            .card {
                grid-template-columns: 1fr;
            }
            .image-section {
                padding: 48px 20px 60px;
            }
            .content {
                padding: 48px 32px;
                order: 2;
            }
            h1 { font-size: 34px; }
        }
    </style>
</head>
<body>
    <span class="sparkle" style="top:6%; left:30%;">✨</span>
    <span class="sparkle" style="bottom:8%; right:28%; animation-delay: 1.2s;">🍃</span>

    <div class="card">
        <div class="content">
            <span class="eyebrow">🌿 สวัสดีครับ / Hello</span>
            <h1>เตชินท์<br>Techin</h1>
            <p class="subtitle">สนใจคณะแพทย์ · Interested in Medicine</p>

            <svg class="pulse" viewBox="0 0 260 36" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 18 Q20 4, 40 18 T80 18 Q100 32, 120 18 T160 18 Q180 4, 200 18 T260 18" />
            </svg>

            <div class="info-list">
                <div class="info-item">
                    <span class="info-label">🩺 Field</span>
                    <span class="info-value">Medical</span>
                </div>
                <div class="info-item">
                    <span class="info-label">🎯 Target</span>
                    <span class="info-value">The Faculty of Medicine, Ramathibodi</span>
                </div>
            </div>

            <p class="github-note">🌐 นี่คือเว็บไซต์แรกของผมที่โฮสต์บน <strong>GitHub Pages</strong></p>

            <a href="portfolio.html" class="btn">
                เปิดหน้าถัดไป
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                </svg>
            </a>
        </div>

        <div class="image-section">
            <div class="profile-img-wrapper">
                <div class="ring"></div>
                <!-- ใส่ path รูปภาพของคุณที่นี่ -->
                <img src="IMG_7964.jpeg" alt="Techin" class="profile-img">
                <span class="badge">🩺 Med Student</span>
            </div>
        </div>
    </div>
</body>
</html>
