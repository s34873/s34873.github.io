<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแนะนำตัวของฉัน 💖</title>
    <style>
        body {
            background-color: #FFF0F5; /* สีชมพูนมพาสเทล ละมุนตา */
            background-image: radial-gradient(#FFB6B9 10%, transparent 11%), radial-gradient(#FFB6B9 10%, transparent 11%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px; /* ลายจุด Polka Dot อ่อนๆ เพิ่มความคิ้วท์ */
            color: #5D536B;
            text-align: center;
            padding: 50px 20px;
            font-family: 'Kanit', 'Segoe UI', sans-serif;
        }

        /* การ์ดหลัก */
        .card {
            background: #FFFFFF;
            border: 4px solid #FFB6B9; /* ขอบสีชมพูวุ้นเส้น */
            border-radius: 25px; /* มุมโค้งมนแบบมนๆ น่ารัก */
            box-shadow: 0 8px 20px rgba(255, 182, 185, 0.4);
            max-width: 45px;
            max-width: 480px;
            margin: 40px auto;
            padding: 40px 30px;
            position: relative;
            animation: float 3s ease-in-out infinite; /* แอนิเมชันลอยดุ๊กดิ๊ก */
        }

        /* ตกแต่งโบว์ด้านบนการ์ด */
        .card::before {
            content: "🎀";
            font-size: 40px;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
        }

        h1 {
            color: #FF7B89;
            font-size: 26px;
            margin-bottom: 25px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            margin: 10px 0;
        }

        .highlight {
            background: linear-gradient(transparent 60%, #FFE3E3 60%); /* ไฮไลต์สีชมพูพาสเทลใต้ข้อความ */
            padding: 0 5px;
        }

        /* ปุ่มกดสุดน่ารัก */
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 35px;
            background-color: #FFB6B9;
            color: white;
            text-decoration: none;
            border-radius: 50px; /* ปุ่มโค้งมนกลมกิ๊ก */
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 0 #FF9296; /* เงาปุ่มแบบ 3D สไตล์ขนมหวาน */
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #FF9296;
            background-color: #FFA4A8;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* แอนิเมชันลอยขึ้นลงเบาๆ */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
    <!-- ดึงฟอนต์ไทยน่ารักๆ มาใช้ -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card">
        <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน ✨🧸</h1>
        <p>สวัสดีค่ะ! ฉันชื่อ <strong class="highlight">ณัฐธิดา (Natthida)</strong> ✨</p>
        <p>กำลังศึกษาอยู่ห้องเรียนพิเศษ <strong class="highlight">Gifted 🧠💡</strong></p>
        <p>นี่คือแฟ้มสะสมผลงานของฉันเองค่ะ! สายรุ้งงง 🌈</p>
        
        <!-- ปุ่มไปหน้าถัดไป -->
        <a href="portfolio.html" class="btn">หน้าถัดไป 🐾</a>
    </div>

</body>
</html>
